<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volunteer Registration</title>
    <style>
         :root {
            --blue-dark: #0d1b3d;
            --blue-mid: #2d4da0;
            --accent: #1ec7a0;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dfe9ff, #eef3ff);
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        
        .card {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 16px 36px rgba(13, 27, 61, 0.13);
        }
        
        h1 {
            color: var(--blue-dark);
            margin-bottom: 6px;
        }
        
        .sub {
            color: #667796;
            margin-bottom: 22px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: #273b67;
        }
        
        input {
            width: 100%;
            border: 1px solid #d5deef;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 1rem;
        }
        
        input:focus {
            outline: none;
            border-color: var(--blue-mid);
            box-shadow: 0 0 0 4px rgba(45, 77, 160, 0.12);
        }
        
        .btn {
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 20px rgba(30, 199, 160, 0.25);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(30, 199, 160, 0.35);
        }
        
        .hint {
            font-size: 0.95rem;
            color: #5b6d90;
            margin-bottom: 12px;
            text-align: center;
        }
        
        .row {
            display: flex;
            gap: 12px;
        }
        
        .row>div {
            flex: 1;
        }
        
        @media (max-width: 520px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <form class="card" onsubmit="event.preventDefault(); alert('Static demo on Vercel: PHP/MySQL not enabled. Connect backend separately to store submissions.');">
        <h1>Join as a Volunteer</h1>
        <p class="sub">Create your volunteer account in seconds.</p>
        <div class="hint">(Vercel demo) Registration form is for UI only. PHP/MySQL requires a different backend setup.</div>

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <div class="row">
            <div>
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" required />
            </div>
        </div>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button class="btn" type="submit">Register</button>

        <p class="hint" style="margin-top:14px; margin-bottom:0;">
            <a href="index.html" style="color: var(--blue-mid); text-decoration:none;">Back to Home</a>
        </p>
    </form>
</body>

</html>
